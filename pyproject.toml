[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-ids"
version = "1.0.0"
description = "Drone Intrusion Detection System for PUSHPAK Grand Challenge 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.0",
    "pyyaml>=6.0.1",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]